name: profile checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: sh scripts/check.sh
